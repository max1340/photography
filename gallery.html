<!-- gallery.html — галерея одним файлом (схема А: masonry, чистые плитки).
     Лежит рядом с firebase.js — тянет реальные данные; открыта отдельно или база пуста — показывает демо-плитки. -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея — M.Photo</title>
<meta name="description" content="Полная галерея пейзажной фотографии: горы, рассветы, море и архитектура.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f5f4f0'/%3E%3Ccircle cx='25' cy='25' r='6.5' fill='%23141312'/%3E%3Ccircle cx='39' cy='25' r='6.5' fill='%23141312'/%3E%3Ccircle cx='25' cy='39' r='6.5' fill='%23141312'/%3E%3Ccircle cx='39' cy='39' r='6.5' fill='%23141312'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/800.css">
<style>
  :root{
    --bg:#141312; --panel:#37362e; --white:#f5f4f0; --gray:#98968f; --line:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#cfceca;font-family:'Manrope',system-ui,sans-serif;color:var(--white);overflow-x:hidden}
  img{display:block}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit;cursor:pointer}

  /* оболочка: серый фон по бокам + тёмный блок, как на главной */
  .page{max-width:1360px;margin:24px auto;background:var(--bg);border-radius:28px;padding:24px 36px 64px;width:100%}

  .seeall{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:#fff;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:4px;transition:border-color .2s}
  .seeall:hover{border-color:#fff}

  .lang-switch{display:flex;gap:12px;font-size:13px;font-weight:600;color:var(--gray);background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border-radius:999px;padding:6px 14px;user-select:none}
  .lang-switch span{cursor:pointer;transition:color .2s}
  .lang-switch span.active,.lang-switch span:hover{color:#fff}

  .arr{width:46px;height:46px;border-radius:50%;background:#fff;color:#141312;border:none;display:grid;place-items:center;flex:none;transition:transform .25s}
  .arr svg{display:block}
  .arr:hover{transform:rotate(45deg)}
  .arr.ghost{background:transparent;border:1px solid var(--line);color:var(--gray)}
  .arr.ghost:hover{transform:none;color:#fff;border-color:#fff}

  .load-more-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.06em;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer;transition:all .25s ease}
  .load-more-btn:hover{background:#fff;color:#111;border-color:#fff;box-shadow:0 8px 24px rgba(255,255,255,.15)}

  /* шапка галереи */
  .g-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:16px;padding:34px 6px 6px}
  .g-back{justify-self:start;padding-top:6px}
  .g-lang{justify-self:end}
  .g-center{text-align:center}
  .g-label{font-size:12px;color:var(--gray);letter-spacing:.08em}
  .g-title{margin-top:8px;font-size:clamp(30px,4vw,52px);font-weight:700;letter-spacing:-.02em}

  /* фильтры — текстовая строка */
  .g-filters{margin-top:20px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px}
  .g-filters button{background:none;border:none;color:var(--gray);font-family:inherit;font-size:13px;letter-spacing:.06em;padding:6px 2px;border-bottom:1px solid transparent;cursor:pointer;transition:color .2s,border-color .2s}
  .g-filters button:hover{color:#fff}
  .g-filters button.active{color:#fff;border-color:#fff;font-weight:700}

  /* masonry на всю ширину тёмной панели */
  .g-grid{margin-top:36px;column-count:4;column-gap:12px}
  .g-item{break-inside:avoid;margin:0 0 12px;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;background:#1e1d19}
  .g-item img{width:100%;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .g-demo{width:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .g-item:hover img,.g-item:hover .g-demo{transform:scale(1.04)}
  .g-cap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.78));opacity:0;transition:opacity .3s;display:flex;flex-direction:column;gap:2px}
  .g-item:hover .g-cap{opacity:1}
  .g-cap b{font-size:13px;font-weight:600;color:#fff}
  .g-cap span{font-size:11px;color:#c9c8c2}

  .g-more{display:flex;justify-content:center;margin:26px 0 8px}

  .g-foot{border-top:1px solid var(--line);margin-top:44px;padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--gray);font-size:13px}

  /* лайтбокс */
  .modal{position:fixed;inset:0;display:none;place-items:center;z-index:200;padding:20px}
  .modal.open{display:grid}
  .mback{position:absolute;inset:0;background:rgba(8,8,7,.82);backdrop-filter:blur(10px)}
  .modal .mbox{position:relative;z-index:2;width:min(1100px,94vw);max-height:92vh;padding:24px;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:rgba(18,17,15,.96);border:1px solid rgba(255,255,255,.14);border-radius:20px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  .mclose{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;font-size:16px;z-index:3;transition:background .2s,color .2s}
  .mclose:hover{background:#fff;color:#111}
  .mimg{max-width:100%;max-height:calc(82vh - 90px);width:auto;height:auto;object-fit:contain;border-radius:12px;display:block;margin:0 auto;background:#0d0d0c}
  .lb-nav{width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;gap:20px;flex-wrap:wrap}
  .lb-cap h4{font-size:22px;font-weight:700;line-height:1.3;color:#fff}
  .lb-cap p{font-size:14px;color:#d6d5cf;margin-top:6px;line-height:1.5}
  .mtags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .mtags .wtag{font-size:13px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#eee}
  .exp-arrows{display:flex;gap:10px}

  @media(max-width:1200px){.page{padding:20px 24px 48px}.g-grid{column-count:3}}
  @media(max-width:900px){.g-grid{column-count:2}}
  @media(max-width:860px){
    .page{margin:12px auto;border-radius:20px;padding:14px 16px 36px}
    .g-head{grid-template-columns:1fr auto}
    .g-center{grid-column:1 / -1;grid-row:2}
    .g-title{font-size:30px}
  }
</style>
</head>
<body>
<div class="page">

  <header class="g-head">
    <div class="g-back">
      <a class="seeall" href="index.html">←&nbsp;<span data-i18n="back">Назад к портфолио</span></a>
    </div>
    <div class="g-center">
      <p class="g-label" data-i18n="label">(галерея)</p>
      <h1 class="g-title" id="gTitle">Все работы</h1>
      <nav class="g-filters" id="gFilters"></nav>
    </div>
    <div class="g-lang lang-switch">
      <span data-lang="ru">RU</span><span data-lang="en">EN</span>
    </div>
  </header>

  <div class="g-grid" id="gGrid"></div>

  <div class="g-more">
    <button class="load-more-btn" id="gMore" hidden>Показать ещё</button>
  </div>

  <footer class="g-foot">
    <span>© M.Photo 2025</span>
    <a class="seeall" href="index.html">←&nbsp;<span data-i18n="back">Назад к портфолио</span></a>
  </footer>

</div>

<!-- лайтбокс -->
<div class="modal" id="lightbox">
  <div class="mback" data-close></div>
  <div class="mbox">
    <button class="mclose" data-close>✕</button>
    <img class="mimg" id="lbImg" alt="">
    <div class="lb-nav">
      <div class="lb-cap">
        <h4 id="lbTitle"></h4>
        <p id="lbSub"></p>
        <div class="mtags" id="lbTags"></div>
      </div>
      <div class="exp-arrows">
        <button class="arr ghost" id="lbPrev" aria-label="Назад"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="arr" id="lbNext" aria-label="Вперёд"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const opt = u => (u && u.includes('res.cloudinary.com') && u.includes('/upload/') && !/\/f_auto/.test(u)) ? u.replace('/upload/', '/upload/f_auto,q_auto/') : u;
  const currentLang = localStorage.getItem('site_lang') || 'ru';
  document.documentElement.lang = currentLang;

  const UI = {
    ru: { back: 'Назад к портфолио', label: '(галерея)', all: 'Все работы', more: 'Показать ещё' },
    en: { back: 'Back to portfolio', label: '(gallery)', all: 'All works', more: 'Show more' }
  };
  const CATS = ['Все', 'Пейзаж', 'Архитектура', 'Снег', 'Горы', 'Море', 'Город'];
  const PAGE = 24;

  let all = [], filtered = [], shown = 0;
  let current = catFromURL();

  const grid = $('#gGrid'), moreBtn = $('#gMore'), titleEl = $('#gTitle');

  /* ---------- язык ---------- */
  $$('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (UI[currentLang] && UI[currentLang][k]) el.textContent = UI[currentLang][k];
  });
  if (UI[currentLang] && UI[currentLang].more) {
    moreBtn.textContent = UI[currentLang].more;
  }
  $$('.lang-switch span').forEach(s => {
    s.classList.toggle('active', s.dataset.lang === currentLang);
    s.onclick = () => {
      if (s.dataset.lang !== currentLang) {
        localStorage.setItem('site_lang', s.dataset.lang);
        location.reload();
      }
    };
  });

  /* ---------- демо-данные для макета (если база недоступна/пуста) ---------- */
  function demoWorks() {
    const bg = [
      'linear-gradient(165deg,#26302b,#7d9082)', 'linear-gradient(165deg,#3a3f4a,#aebfd4)',
      'linear-gradient(200deg,#4a3a30,#d4b98e)', 'linear-gradient(180deg,#20303a,#7fb2c9)',
      'linear-gradient(180deg,#2c2c34,#9a9aa6)', 'linear-gradient(160deg,#31402c,#b9cf9a)',
      'linear-gradient(200deg,#40303a,#d4a3b9)', 'linear-gradient(180deg,#25343a,#8ec9b2)'
    ];
    const ratios = ['3/2','2/3','1/1','4/5','16/10','3/4','2/3','3/2','1/1','4/3','2/3','16/10','3/4','3/2'];
    const titles = ['Рассвет в тумане','Горная тропа','Озеро на заре','Старый мост','Туман в долине','Снежный лес','Море и скалы','Ночной город','Водопад','Альпийский луг','Серпантин','Маяк','Хвойный склон','Отражение'];
    return titles.map((t, i) => ({
      id: 'demo' + i, title: t, place: 'Демо-подборка',
      tags: [CATS[1 + (i % 6)]], url: '', demo: true,
      bg: bg[i % bg.length], ratio: ratios[i % ratios.length]
    }));
  }

  /* ---------- фильтры ---------- */
  function catFromURL() {
    const p = new URLSearchParams(location.search).get('cat');
    return CATS.includes(p) ? p : 'Все';
  }
  function renderFilters() {
    $('#gFilters').innerHTML = CATS.map(c =>
      `<button data-cat="${c}" class="${c === current ? 'active' : ''}">${c}</button>`
    ).join('');
    $$('#gFilters button').forEach(b => b.addEventListener('click', () => {
      current = b.dataset.cat;
      history.replaceState(null, '', current === 'Все' ? location.pathname : '?cat=' + encodeURIComponent(current));
      renderFilters();
      apply();
    }));
  }
  function matches(w, cat) {
    const cl = cat.toLowerCase();
    return (w.tags || []).some(t => t.toLowerCase().includes(cl)) ||
           (w.title || '').toLowerCase().includes(cl) ||
           (w.place || w.sub || '').toLowerCase().includes(cl);
  }
  function apply() {
    filtered = current === 'Все' ? all : all.filter(w => matches(w, current));
    titleEl.textContent = current === 'Все' ? UI[currentLang].all : current;
    grid.innerHTML = '';
    shown = 0;
    loadMore();
  }

  /* ---------- плитки ---------- */
  function tile(w, i) {
    const el = document.createElement('figure');
    el.className = 'g-item';
    const media = w.url
      ? `<img src="${opt(w.url)}" alt="${w.title || ''}" loading="lazy">`
      : `<div class="g-demo" style="aspect-ratio:${w.ratio || '3/2'};background:${w.bg}"></div>`;
    el.innerHTML = media + `<figcaption class="g-cap"><b>${w.title || ''}</b><span>${w.place || ''}</span></figcaption>`;
    el.addEventListener('click', () => lbShow(i));
    return el;
  }
  function loadMore() {
    const next = filtered.slice(shown, shown + PAGE);
    next.forEach((w, k) => grid.appendChild(tile(w, shown + k)));
    shown += next.length;
    moreBtn.hidden = shown >= filtered.length;
  }
  moreBtn.addEventListener('click', loadMore);

  /* ---------- лайтбокс ---------- */
  let lb = 0;
  const lbModal = $('#lightbox');
  const openM = m => { m.classList.add('open'); document.body.style.overflow = 'hidden'; };
  const closeM = m => { m.classList.remove('open'); document.body.style.overflow = ''; };
  function lbShow(i) {
    if (!filtered.length) return;
    lb = (i + filtered.length) % filtered.length;
    const w = filtered[lb];
    const img = $('#lbImg');
    if (w.url) {
      img.src = opt(w.url);
      img.style.aspectRatio = '';
      img.style.width = '';
      img.style.background = '';
    } else {
      img.removeAttribute('src');
      img.style.aspectRatio = w.ratio || '3/2';
      img.style.width = 'min(80vw, 900px)';
      img.style.background = w.bg;
    }
    $('#lbTitle').textContent = w.title || '';
    $('#lbSub').textContent = [w.place, w.sub].filter(Boolean).join(' • ');
    $('#lbTags').innerHTML = (w.tags || []).map(t => `<span class="wtag">${t}</span>`).join('');
    openM(lbModal);
  }
  $('#lbNext').onclick = () => lbShow(lb + 1);
  $('#lbPrev').onclick = () => lbShow(lb - 1);
  lbModal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeM(lbModal); });
  document.addEventListener('keydown', e => {
    if (!lbModal.classList.contains('open')) return;
    if (e.key === 'Escape') closeM(lbModal);
    if (e.key === 'ArrowRight') lbShow(lb + 1);
    if (e.key === 'ArrowLeft') lbShow(lb - 1);
  });

  import { dbAll } from './firebase.js?v=2';

  /* ---------- старт: реальные данные, иначе демо ---------- */
  renderFilters();
  (async () => {
    try {
      const list = (await dbAll('works_' + currentLang)) || [];
      list.sort((a, b) => (a.order || 0) - (b.order || 0));
      all = list;
    } catch (e) { all = []; }
    if (!all.length) all = demoWorks();
    apply();
  })();
</script>
</body>
</html>
